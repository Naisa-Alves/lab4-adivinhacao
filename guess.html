<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinhação</title>
    <style>
        body {
            background-color: #c4d6b0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #555;
        }

        .input-box {
            background-color: #d8f5a2;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        input {
            width: 60px;
            padding: 5px;
            font-size: 18px;
            text-align: center;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        button {
            background-color: transparent;
            border: none;
            color: #555;
            font-size: 16px;
            cursor: pointer;
        }

        #resultado {
            background-color: #d8f5a2;
            font-size: 28px;
            font-weight: bold;
            padding: 10px 20px;
            margin-bottom: 30px;
            min-width: 200px;
            text-align: center;
        }

        .secao-tentativas {
            text-align: center;
            margin-bottom: 25px;
        }

        .secao-tentativas h3 {
            font-weight: normal;
            font-size: 18px;
            margin-bottom: 10px;
            color: #666;
        }

        .lista-numeros {
            background-color: #d8f5a2;
            font-size: 24px;
            font-weight: bold;
            padding: 8px 15px;
            display: inline-block;
            min-width: 150px;
        }
    </style>
</head>
<body>

    <div class="input-box">
        <input type="number" id="chute" min="0" max="99">
        <button onclick="verificarAdivinhacao()">Clique aqui</button>
    </div>

    <div id="resultado"></div>

    <div class="secao-tentativas">
        <h3>Tentativas pequenas:</h3>
        <div id="pequenas" class="lista-numeros"></div>
    </div>

    <div class="secao-tentativas">
        <h3>Tentativas grandes:</h3>
        <div id="grandes" class="lista-numeros"></div>
    </div>

    <script>
        const numeroSorteado = Math.floor(Math.random() * 100);
        const tentativasPequenas = [];
        const tentativasGrandes = [];

        function verificarAdivinhacao() {
            const inputChute = document.getElementById("chute");
            const resultado = document.getElementById("resultado");
            const valor = parseInt(inputChute.value);

            if (isNaN(valor)) return;

            if (valor === numeroSorteado) {
                resultado.innerText = "número igual";
                resultado.style.backgroundColor = "#d8f5a2";
            } else if (valor < numeroSorteado) {
                resultado.innerText = "número menor";
                resultado.style.backgroundColor = "#ff9999"; // Fundo vermelho ao errar
                tentativasPequenas.push(valor);
                document.getElementById("pequenas").innerText = tentativasPequenas.join(",");
            } else {
                resultado.innerText = "número maior";
                resultado.style.backgroundColor = "#ff9999"; // Fundo vermelho ao errar
                tentativasGrandes.push(valor);
                document.getElementById("grandes").innerText = tentativasGrandes.join(",");
            }

            inputChute.value = "";
            inputChute.focus();
        }
    </script>

</body>
</html>
