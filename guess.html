<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinhação</title>
    <style>
        /* CSS ultra simples conforme o slide */
        body {
            background-color: #b0b0b0; /* Cor de fundo acinzentada/esverdeada */
            font-family: Times, "Times New Roman", serif; /* Fonte clássica igual à da foto */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #555;
        }

        .caixa-input {
            background-color: #d8f5a2;
            padding: 10px 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 50px;
            font-size: 16px;
            text-align: center;
            border: 1px solid #777;
            margin-bottom: 8px;
            color: #449944;
        }

        button {
            background: none;
            border: none;
            color: #777;
            font-size: 16px;
            cursor: pointer;
            padding: 0;
        }

        #resultado {
            background-color: #d8f5a2;
            font-size: 32px;
            color: #ffffff;
            padding: 5px 15px;
            margin-bottom: 25px;
            text-align: center;
        }

        .rotulo {
            color: #777;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .caixa-tentativas {
            background-color: #d8f5a2;
            font-size: 28px;
            color: #c0b060;
            padding: 5px 15px;
            margin-bottom: 25px;
            min-width: 120px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="caixa-input">
        <input type="number" id="chute" min="0" max="99">
        <br>
        <button onclick="verificarAdivinhacao()">Clique aqui</button>
    </div>

    <div id="resultado"></div>

    <div class="rotulo">Tentativas pequenas:</div>
    <div id="pequenas" class="caixa-tentativas"></div>

    <div class="rotulo">Tentativas grandes:</div>
    <div id="grandes" class="caixa-tentativas"></div>

    <script>
        const numeroSorteado = Math.floor(Math.random() * 100);
        const tentativasPequenas = [];
        const tentativasGrandes = [];

        function verificarAdivinhacao() {
            const inputChute = document.getElementById("chute");
            const resultado = document.getElementById("resultado");
            const valor = parseInt(inputChute.value);

            if (isNaN(valor)) return;

            if (valor === numeroSorteado) {
                resultado.innerText = "número igual";
                resultado.style.backgroundColor = "#d8f5a2";
            } else if (valor < numeroSorteado) {
                resultado.innerText = "número menor";
                resultado.style.backgroundColor = "#red"; // Ou a cor que preferir ao errar
                tentativasPequenas.push(valor);
                document.getElementById("pequenas").innerText = tentativasPequenas.join(",");
            } else {
                resultado.innerText = "número maior";
                resultado.style.backgroundColor = "#red";
                tentativasGrandes.push(valor);
                document.getElementById("grandes").innerText = tentativasGrandes.join(",");
            }

            inputChute.value = "";
            inputChute.focus();
        }
    </script>

</body>
</html>
